[project]
name = "news-graph"
version = "0.1.0"
description = "Extract information from English text and explore it in an interactive graph."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "spacy>=3.8.16,<3.9",
    "en-core-web-lg==3.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
